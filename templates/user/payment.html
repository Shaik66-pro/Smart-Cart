<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay Gateway - SmartCart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="/user-dashboard" class="nav-brand">
                <div class="nav-brand-icon">
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>
                Smart<span>Cart</span>
            </a>
            <a href="/user/cart" class="btn btn-secondary btn-sm">
                Cancel Payment
            </a>
        </div>
    </header>

    <main class="main-wrapper" style="max-width: 550px; margin: 4rem auto; text-align: center;">
        <div class="form-card">
            <div style="width: 72px; height: 72px; margin: 0 auto 1.5rem; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 2rem;">
                <i class="fa-solid fa-credit-card"></i>
            </div>

            <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem;">Complete Payment</h2>
            <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem;">
                Please authorize your payment of <strong>₹{{ amount }}</strong> to confirm your SmartCart order.
            </p>

            <div style="background: var(--bg-alt); padding: 1.25rem; border-radius: var(--radius-lg); margin-bottom: 2rem; border: 1px solid var(--border);">
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                    <span style="color: var(--text-muted);">Order ID</span>
                    <span style="font-family: monospace; font-weight: 600;">{{ order_id }}</span>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 1.25rem; font-weight: 800;">
                    <span>Total Amount</span>
                    <span style="color: var(--primary);">₹{{ amount }}</span>
                </div>
            </div>

            <button id="rzp-button" class="btn btn-primary btn-lg btn-block">
                <i class="fa-solid fa-lock"></i> Authorize & Pay with Razorpay
            </button>

            <button type="button" onclick="simulatePayment()" class="btn btn-secondary btn-block btn-sm" style="margin-top: 1rem; color: var(--text-muted);">
                <i class="fa-solid fa-vial"></i> Simulate Instant Test Payment
            </button>
        </div>
    </main>

    <script>
        var options = {
            "key": "{{ key_id }}",
            "amount": "{{ (amount * 100)|int }}",
            "currency": "INR",
            "name": "SmartCart Luxury Store",
            "description": "Payment for Order {{ order_id }}",
            "order_id": "{{ order_id }}",
            "handler": function (response){
                submitPayment(response.razorpay_payment_id, response.razorpay_order_id, response.razorpay_signature);
            },
            "theme": {
                "color": "#4f46e5"
            }
        };

        var rzp = new Razorpay(options);
        document.getElementById('rzp-button').onclick = function(e){
            rzp.open();
            e.preventDefault();
        }

        function simulatePayment() {
            const demoPaymentId = "pay_demo_" + Math.random().toString(36).substring(2, 12);
            submitPayment(demoPaymentId, "{{ order_id }}", "demo_test_signature");
        }

        function submitPayment(paymentId, orderId, signature) {
            var form = document.createElement("form");
            form.method = "POST";
            form.action = "/verify-payment";

            var fields = {
                razorpay_payment_id: paymentId,
                razorpay_order_id: orderId,
                razorpay_signature: signature
            };

            for (var name in fields) {
                var input = document.createElement("input");
                input.type = "hidden";
                input.name = name;
                input.value = fields[name];
                form.appendChild(input);
            }

            document.body.appendChild(form);
            form.submit();
        }
    </script>
</body>
</html>
